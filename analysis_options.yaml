# This file configures the static analysis results for your project (errors,
# warnings, and lints).
#
# This file is generated from a standard template. Please do not edit
# without consulting the team.

# For more information see:
# https://dart.dev/guides/language/analysis-options

include: package:flutter_lints/flutter.yaml

linter:
  # The lint rules are categorized in "groups" depending on their severity
  # and impact on the project. For more info, see:
  # https://dart-lang.github.io/linter/lints/index.html
  rules:
    # ===== Style Rules ===== #
    - always_declare_return_types
    - camel_case_types
    - empty_catches
    - prefer_single_quotes
    - sort_constructors_first
    - sort_pub_dependencies
    - unnecessary_brace_in_string_interps
    - use_key_in_widget_constructors

    # ===== Best Practices ===== #
    - avoid_print
    - avoid_unnecessary_containers
    - no_logic_in_create_state
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - use_build_context_synchronously

    # ===== Clean Code ===== #
    - avoid_classes_with_only_static_members
    - prefer_relative_imports
    - require_trailing_commas

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # treat missing required parameters as a warning (not a hint)
    missing_required_param: warning
    # treat missing returns as an error (not a warning)
    missing_return: error
    # allow having TODOs in the code
    todo: ignore

  plugins:
    - dart_code_metrics

dart_code_metrics:
  metrics:
    cyclomatic-complexity: 20
    number-of-parameters: 4
    maximum-nesting-level: 5
  rules:
    - newline-before-return
    - no-boolean-literal-compare
    - no-empty-block
    - prefer-trailing-comma
    - prefer-conditional-expressions
    - no-equal-then-else