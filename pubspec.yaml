name: whobird_flutter
description: A Flutter implementation of the whoBIRD application for real-time bird sound identification.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core & Utilities
  get_it: ^7.6.0
  permission_handler: ^11.0.0
  path_provider: ^2.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2

  # Presentation (BLoC)
  flutter_bloc: ^8.1.3
  equatable: ^2.0.7
  bloc_concurrency: ^0.2.2

  # Data
  drift: ^2.11.0
  sqlite3_flutter_libs: ^0.5.15
  tflite_flutter: ^0.11.0 # Check for latest compatible version
  mic_stream: ^0.7.3-dev # Check for latest compatible version and null safety
  geolocator: ^10.1.0
  scidart: ^0.0.2-dev.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  drift_dev: ^2.11.0
  build_runner: ^2.4.6
  bloc_test: ^9.1.4
  mocktail: ^1.0.0

flutter:
  uses-material-design: true